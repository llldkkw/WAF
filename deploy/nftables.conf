#!/usr/sbin/nft -f
# 网关（跳板机）防火墙。默认拒绝一切入站，只开放：
#   公网: 80/443（网站流量，经 WAF 检查）、51820/udp（WireGuard）
#   VPN 内: SSH、管理面板、通过网关访问内网服务器
# 部署前请修改下面的变量！ 应用: nft -f /etc/nftables.conf

define WAN_IF   = "eth0"            # 公网网卡
define LAN_IF   = "eth1"            # 内网网卡（连接后端服务器），没有独立网卡就删掉 forward 里相关行
define VPN_IF   = "wg0"
define VPN_NET  = 10.8.0.0/24
define LAN_NET  = 10.0.0.0/24       # 后端服务器所在内网
define WG_PORT  = 51820

flush ruleset

table inet filter {
	# 预留：可手动或用脚本把 IP 加入此集合，在 L4 层直接丢弃
	set blocklist_v4 {
		type ipv4_addr
		flags interval, timeout
	}

	chain input {
		type filter hook input priority 0; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop

		ip saddr @blocklist_v4 drop

		# ICMP（限速）
		meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept

		# WireGuard
		iifname $WAN_IF udp dport $WG_PORT accept

		# 网站流量 → WAF
		tcp dport { 80, 443 } ct state new limit rate over 2000/second burst 4000 packets drop
		tcp dport { 80, 443 } accept

		# 只有 VPN 内才能 SSH 和打开管理面板
		iifname $VPN_IF ip saddr $VPN_NET tcp dport { 22, 9443 } accept

		# 其余全部丢弃（可取消注释记录日志排查问题）
		# limit rate 5/minute log prefix "nft-drop: "
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
		ct state established,related accept
		ct state invalid drop

		# VPN 用户经网关访问内网服务器（SSH、数据库等），这就是"跳板"
		iifname $VPN_IF oifname $LAN_IF ip saddr $VPN_NET ip daddr $LAN_NET accept
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority 100;
		# VPN 访问内网时做源地址转换，后端服务器只需信任网关 IP
		oifname $LAN_IF ip saddr $VPN_NET masquerade
	}
}
